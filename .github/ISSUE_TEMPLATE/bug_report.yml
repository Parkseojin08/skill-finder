name: 버그 신고
description: 동작이 이상하거나 오류가 납니다
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 어떤 화면에서 무엇을 했고, 무엇을 기대했는데 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 만드는 방법
      placeholder: |
        1. 검색창에 "pdf tables" 입력
        2. 첫 결과의 설치 탭 열기
        3. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보
      description: 설정 화면의 "진단 정보 복사"를 눌러 붙여 넣어 주세요(토큰 같은 비밀값은 가려집니다).
      render: text
  - type: input
    id: env
    attributes:
      label: 설치 방식과 OS
      placeholder: 예) Windows zip(SkillFinder.exe), Windows 11
